/* =========================================================================
   路由
   ========================================================================= */
const params = new URLSearchParams(location.search);
const taskKey = params.get('task');

if (taskKey && GUIDES[taskKey]) {
  // 直接播放该子任务的 VoiceGuide
  const guide = GUIDES[taskKey];
  VoiceGuide.show(guide.config).then(() => {
    document.body.innerHTML = `
      <div class="home">
        <h1>${guide.title} 已结束</h1>
        <p class="sub">你看到的就是跑正式任务前这一屏。</p>
        <div class="link-list">
          <a href="preview-guide.html">&laquo; 返回所有指导语</a>
          <a href="preview-guide.html?task=${taskKey}">再看一遍这一屏</a>
        </div>
      </div>`;
  });
} else {
  // 首页:列 7 个链接
  const target = document.getElementById('jspsych-target');
  const order = ['rules','A0','B2','B1','A1','B3','B4'];
  let html = `
    <div class="home">
      <h1>TMT 指导语独立预览</h1>
      <div class="sub">点击任一链接直接打开对应的 VoiceGuide 指导语页面,不会进入正式实验。</div>
      <div class="link-list">`;
  for (const k of order) {
    const g = GUIDES[k];
    html += `<a href="preview-guide.html?task=${k}">
      <div class="task">${g.title}</div>
      <div class="desc">${g.desc}</div>
    </a>`;
  }
  html += `</div>
      <div class="tip">
        <b>提示:</b>每个链接打开后,跟正式跑实验时看到的指导语完全一样(相同图片、相同音频、相同红框、相同按钮)。
        点指导语里的"开始"或按 Esc(主试模式下)会结束该屏,不会进入画板试次。
      </div>
    </div>`;
  target.innerHTML = html;
}
