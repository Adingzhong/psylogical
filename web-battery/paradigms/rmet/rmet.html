<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>看眼读心 - 认知评估</title>
  <link rel="stylesheet" href="../../lib/jspsych.css?v=20260413a">
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    /* RMET — 白底,图片居中偏上,3按钮底部 */
    body {
      background: #FFFFFF;
      color: #1A1A2E;
    }

    /* 刺激图片容器: 居中,垂直位置 32% (原版 PsychoPy pos=(0,+200) 换算)
       图片尺寸: 716 × 215 CSS px ≈ 15° × 4.5° 视觉角
       (Surface Pro 11: 29×20cm, 1440×960 CSS, 1° ≈ 47.7 CSS px, 55cm 观察距离)
       参考: Baron-Cohen et al. (2001) Revised Eyes Test 标准 */
    .rmet-stimulus-container {
      position: fixed;
      left: 50%;
      top: 32%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }
    .rmet-stimulus-img {
      width: 716px;
      max-width: 92vw;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      border-radius: 6px;
    }

    /* 注视点: 黑色 + 号,白底居中 */
    .rmet-fixation {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-size: 120px;
      color: #000000;
      font-weight: 400;
      user-select: none;
    }

    /* 空白屏 (ITI) */
    .rmet-blank {
      height: 100vh;
      background: #FFFFFF;
    }

    /* 进度指示 (右上角) */
    .rmet-progress {
      position: fixed;
      top: 12px;
      right: 24px;
      color: rgba(0,0,0,0.4);
      font-size: 32px;
      font-family: var(--font);
      pointer-events: none;
      z-index: 20;
    }

    /* 3 按钮布局: 左右贴边 + 中间 Fitts 补偿加宽 (对齐 N-back B1/B2 标准) */
    #jspsych-html-button-response-btngroup.jspsych-btn-group-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: fixed;
      bottom: 40px;
      left: 6%;
      right: 6%;
      margin: 0;
      padding: 0;
      z-index: 100;
      pointer-events: none;
    }
    #jspsych-html-button-response-btngroup .rmet-response-btn {
      min-width: 280px;
      min-height: 131px;
      padding: 20px 36px;
      border-radius: 12px;
      background: #B0B0B0 !important;
      border: 2px solid #707070 !important;
      color: #1A1A1A !important;
      font-size: 46px;
      font-family: var(--font);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: all 0.12s;
      pointer-events: auto;
      white-space: nowrap;
    }
    /* Fitts 定律补偿: 中间按钮加宽 (对齐 N-back nback.html:71-74) */
    #jspsych-html-button-response-btngroup .rmet-response-btn:nth-child(2) {
      min-width: 360px;
    }
    #jspsych-html-button-response-btngroup .rmet-response-btn:hover {
      background: #C0C0C0 !important;
    }
    #jspsych-html-button-response-btngroup .rmet-response-btn:active {
      background: #8C8C8C !important;
      transform: scale(0.97);
    }

    /* 指导语页 — 文字版 (转场指导语,非 VoiceGuide 大图) */
    .instr-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 32px 40px 12px;
      text-align: center;
    }
    .instr-title {
      font-size: 52px;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 24px;
      line-height: 1.3;
    }
    .instr-body {
      font-size: 36px;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 900px;
    }
    .instr-body b, .instr-body strong {
      color: var(--text);
      font-weight: 700;
    }
    .instr-highlight {
      display: inline-block;
      background: #E3F2FD;
      color: var(--primary);
      font-weight: bold;
      padding: 4px 16px;
      border-radius: 8px;
      font-size: 38px;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
  <script src="../../lib/jspsych.js?v=20260413a"></script>
  <script src="../../lib/plugins/html-button-response.js?v=20260413a"></script>
  <script src="../../lib/plugins/html-keyboard-response.js?v=20260413a"></script>
  <script src="../../lib/plugins/call-function.js?v=20260413a"></script>
  <script src="../../lib/plugins/preload.js?v=20260413a"></script>
  <script src="../../lib/paradigm-camera.js?v=20260419f"></script>
  <script src="../../lib/jszip.min.js?v=20260410b"></script>
  <script src="../../lib/end-screen.js?v=20260419g"></script>
  <script src="../../lib/safe-fetch.js?v=20260418a"></script>
  <script src="../../lib/attention-probe.js?v=20260413a"></script>
  <script src="../../lib/touch-hardening.js?v=20260419c"></script>
  <script src="../../lib/voice-guide.js?v=20260423j"></script>
  <script src="rmet.js?v=20260419f"></script>
</body>
</html>
