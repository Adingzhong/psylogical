<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flanker - 认知评估</title>
  <link rel="stylesheet" href="../../lib/jspsych.css?v=20260410e">
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    /* Flanker: 默认白底，试次阶段动态切黑底 */

    /* ===== 试次阶段注视点: 白色, 9.4vh (文献~1°× 2.2倍放大 = 2.2°视角) ===== */
    .flanker-fixation {
      font-size: 9.4vh !important;
      color: #FFFFFF !important;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* ===== 倒计时: 白色大数字, 黑底, 居中 (原版 COUNTDOWN_HEIGHT=0.12) ===== */
    .flanker-countdown {
      font-size: 12vh !important;
      color: #FFFFFF !important;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* ===== 刺激图片容器 ===== */
    /* 刺激容器: 100vh全屏居中，与注视点完全重合 */
    .flanker-stimulus {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .flanker-stimulus img {
      /* 横向物理 4.2 cm — MCI Flanker 文献一致标准:
         - Wang et al. 2013 (Clin Neurophysiol 124:2389-2396) — NC/MCI/AD, 4.2 × 2.2 cm
         - Tsai et al. 2018 (NeuroImage Clinical 17:272-284) — aMCI 老人, 4.2 × 2.2 cm
         两篇独立研究用了完全一样的物理尺寸, 说明这是领域惯例
         Surface Pro 11: 29×20 cm / 1440×960 CSS → 0.02014 cm/px
         → 4.2 cm = 209 px 宽 (≈4.38° @ 55 cm)
         高度按 PNG 原始比例 6.23:1 自动 → ~33 px, 不强制匹配 Wang/Tsai 的 2.2 cm —
         Flanker 效应由横向视角(目标-侧翼间距)决定, 高度只要可见即可 */
      width: 209px;
      height: auto;
      image-rendering: auto;
    }

    /* ===== 练习错误反馈: 黑底, 红X+白色文字, 字号>=40px (原版1.5秒) ===== */
    .flanker-feedback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #000000;
    }
    .flanker-feedback .feedback-x {
      font-size: 72px;
      color: #F44336;
      font-weight: bold;
    }
    .flanker-feedback .feedback-answer {
      font-size: 44px;
      color: #FFFFFF;
      margin-top: 20px;
    }

    /* ===== 试次阶段空白屏(pre/post blank): 黑底 ===== */
    .flanker-blank {
      height: 100vh;
      background: #000000;
    }

    /* ===== Instruction page styles (elderly-friendly) — 白底 ===== */
    .instr-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 55vh;
      padding: 24px 40px 12px;
      text-align: center;
    }
    .instr-title {
      font-size: 48px;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 20px;
      line-height: 1.3;
    }
    .instr-body {
      font-size: 34px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 960px;
    }
    .instr-body b, .instr-body strong {
      color: var(--text);
      font-weight: 700;
    }
    .instr-highlight {
      display: inline-block;
      background: #E3F2FD;
      color: var(--primary);
      font-weight: bold;
      padding: 4px 16px;
      border-radius: 8px;
      font-size: 38px;
    }
    .instr-continue-btn {
      margin-top: 12px !important;
    }
    /* Example row: side-by-side images with labels */
    .instr-examples {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 24px;
      flex-wrap: wrap;
      margin: 14px 0 6px;
    }
    .instr-example-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 2px solid var(--border);
    }
    .instr-example-card img {
      width: 280px;
      height: auto;
      border-radius: 6px;
      background: #222;
    }
    .instr-example-label {
      font-size: 24px;
      font-weight: 600;
    }
    .instr-example-sublabel {
      font-size: 20px;
      color: var(--text-secondary);
    }
    /* Key rule box with border */
    .instr-rule-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin: 16px 0;
      padding: 18px 32px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 2px solid var(--border);
    }
    .instr-rule-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .instr-rule-item .arrow-icon {
      font-size: 56px;
      color: var(--primary);
    }
    .instr-rule-item .rule-label {
      font-size: 30px;
      font-weight: bold;
      color: var(--text);
    }
    .instr-divider {
      width: 2px;
      height: 64px;
      background: var(--border);
    }
    /* Override jsPsych button group for trial response buttons —
       原版: RESP_BTN_X_OFFSET=0.28, RESP_BTN_Y=-0.38, RESP_BTN_W=0.30, RESP_BTN_H=0.12
       pin left/right buttons to opposite bottom corners for tablet landscape. */
    #jspsych-html-button-response-btngroup.jspsych-btn-group-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: fixed;
      bottom: 40px;
      left: 8%;
      right: 8%;
      margin: 0;
      z-index: 100;
      pointer-events: none;
    }
    /* ===== 响应按钮: 统一规范 ===== */
    #jspsych-html-button-response-btngroup .response-btn {
      min-width: 300px;
      min-height: 131px;
      padding: 20px 56px;
      border-radius: 12px;
      background: #B0B0B0 !important;
      border: 2px solid #707070 !important;
      color: #1A1A1A !important;
      font-size: 42px;
      font-family: var(--font);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: all 0.15s;
      pointer-events: auto;
    }
    #jspsych-html-button-response-btngroup .response-btn:hover {
      background: #C0C0C0 !important;
    }
    #jspsych-html-button-response-btngroup .response-btn:active {
      background: #8C8C8C !important;
    }
    .rating-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .rating-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .rating-btn {
      width: 88px;
      height: 88px;
      font-size: 36px;
      font-weight: bold;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.15s;
      font-family: var(--font);
    }
    .rating-btn:active, .rating-btn.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
  <script src="../../lib/jspsych.js?v=20260410e"></script>
  <script src="../../lib/plugins/html-button-response.js?v=20260410e"></script>
  <script src="../../lib/plugins/html-keyboard-response.js?v=20260410e"></script>
  <script src="../../lib/plugins/image-button-response.js?v=20260410e"></script>
  <script src="../../lib/plugins/call-function.js?v=20260410e"></script>
  <script src="../../lib/plugins/preload.js?v=20260410e"></script>
  <script src="../../lib/paradigm-camera.js?v=20260419f"></script>
  <script src="../../lib/jszip.min.js?v=20260410b"></script>
  <script src="../../lib/end-screen.js?v=20260419g"></script>
  <script src="../../lib/safe-fetch.js?v=20260418a"></script>
  <script src="../../lib/attention-probe.js?v=20260410e"></script>
  <script src="../../lib/touch-hardening.js?v=20260419c"></script>
  <script src="../../lib/voice-guide.js?v=20260423j"></script>
  <script src="flanker.js?v=20260419f"></script>
</body>
</html>
