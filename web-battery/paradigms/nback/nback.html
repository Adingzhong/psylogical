<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>N-back - 工作记忆</title>
  <link rel="stylesheet" href="../../lib/jspsych.css?v=20260410e">
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    /* N-back specific styles */
    .nback-stim-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
    }
    .nback-stim-img {
      max-height: 52vh;
      max-width: 82vw;
      object-fit: contain;
      border-radius: 8px;
    }
    /* B4 需要给底部大按钮腾空间,图稍微收小避免重叠 */
    .nback-stim-container.b4-mode .nback-stim-img {
      max-height: 44vh;
    }
    .nback-stim-container.b4-mode {
      min-height: 44vh;
      padding-bottom: 20px;
    }
    .nback-target-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 50;
      text-align: center;
    }
    .nback-target-panel img {
      max-height: 22vh;
      max-width: 22vw;
      object-fit: contain;
      border: 3px solid #FFA500;
      border-radius: 8px;
    }
    .nback-target-label {
      font-size: 24px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    /* Three-button row for B1/B2 — spread across screen for tablet reach */
    .nback-btn-row {
      display: flex;
      justify-content: space-between;
      position: fixed;
      bottom: 40px;
      left: 8%; right: 8%;
      z-index: 100;
    }
    .nback-btn-3 {
      min-width: 280px;
      min-height: 131px;
      padding: 20px 56px;
      border-radius: 12px;
      background: #B0B0B0;
      border: 2px solid #707070;
      color: #1A1A1A;
      font-size: 42px;
      font-family: var(--font);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: all 0.12s;
    }
    /* 中间按钮加宽: Fitts定律补偿(两侧目标夹击,中间更难按) */
    .nback-btn-3:nth-child(2) {
      min-width: 360px;
    }
    .nback-btn-3:hover {
      background: #C0C0C0;
    }
    .nback-btn-3:active {
      background: #8C8C8C;
    }
    .nback-btn-3.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    /* B3 probe options — spread for tablet */
    .nback-probe-options {
      display: flex;
      justify-content: space-between;
      padding: 0 4%;
      margin-top: 24px;
    }
    .nback-probe-opt {
      cursor: pointer;
      border: 4px solid transparent;
      border-radius: 12px;
      transition: border-color 0.15s, transform 0.1s;
      touch-action: manipulation;
    }
    .nback-probe-opt img {
      max-height: 32vh;
      max-width: 26vw;
      object-fit: contain;
      border-radius: 8px;
    }
    .nback-probe-opt:active {
      transform: scale(0.96);
    }
    .nback-probe-opt.selected {
      border-color: var(--primary);
    }
    /* B4 single GO button — centered bottom,尺寸对齐 SART 响应按钮(50vw) */
    .nback-go-btn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: 50vw;
      min-width: 360px;
      min-height: 131px;
      padding: 20px 56px;
      border-radius: 12px;
      background: #B0B0B0;
      border: 2px solid #707070;
      color: #1A1A1A;
      font-size: 42px;
      font-family: var(--font);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.12s;
    }
    .nback-go-btn:hover {
      background: #C0C0C0;
    }
    .nback-go-btn:active {
      background: #8C8C8C;
    }
    /* Feedback — vertically centered */
    .nback-feedback-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
    }
    .nback-feedback {
      font-size: 56px;
      font-weight: bold;
      text-align: center;
    }
    .nback-feedback.correct { color: var(--success); }
    .nback-feedback.incorrect { color: var(--error); }
    .nback-feedback-detail {
      font-size: 32px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 20px;
    }
    /* Instruction image (simple pages like welcome/rest) */
    .nback-instr-img {
      max-height: 62vh;
      max-width: 92vw;
      object-fit: contain;
      margin: 10px auto;
      display: block;
    }

    /* ===== Rich Block Instruction Pages ===== */
    .nback-instr-rich {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 24px 0;
      max-width: 960px;
      margin: 0 auto;
    }
    .nback-instr-badge {
      font-size: 20px;
      color: #999;
      margin-bottom: 4px;
      letter-spacing: 2px;
    }
    .nback-instr-title {
      font-size: 36px;
      font-weight: bold;
      color: #1565C0;
      margin-bottom: 8px;
      text-align: center;
    }
    .nback-instr-img-wrap {
      margin: 6px 0 8px;
      text-align: center;
    }
    .nback-instr-illust {
      max-height: 48vh;
      max-width: 94vw;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
    }
    .nback-instr-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 6px 0;
      width: 100%;
      max-width: 700px;
    }
    .nback-instr-step {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 28px;
      line-height: 1.4;
      color: var(--text);
    }
    .nback-instr-step-num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1565C0;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      flex-shrink: 0;
    }
    .nback-instr-step-text {
      flex: 1;
    }
    /* Button legend (B1/B2) */
    .nback-instr-btn-legend {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 8px 0 4px;
      flex-wrap: wrap;
    }
    .nback-instr-btn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .nback-instr-btn-sample {
      display: inline-block;
      padding: 10px 28px;
      border-radius: 10px;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      min-width: 120px;
      text-align: center;
    }
    .nback-instr-btn-desc {
      font-size: 22px;
      color: #666;
    }
    /* B4 action rules */
    .nback-instr-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 6px 0;
      width: 100%;
      max-width: 600px;
    }
    .nback-instr-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 30px;
      line-height: 1.5;
    }
    .nback-instr-action-cond {
      font-weight: bold;
      color: #1565C0;
      font-size: 32px;
    }
    .nback-instr-action-arrow {
      color: #999;
      font-size: 28px;
    }
    .nback-instr-action-result {
      font-size: 28px;
    }
    .nback-instr-highlight {
      margin: 6px 0 4px;
      padding: 8px 20px;
      background: #FFF3E0;
      border-left: 5px solid #FFA726;
      border-radius: 8px;
      font-size: 24px;
      font-weight: bold;
      color: #E65100;
      text-align: center;
    }
    .nback-instr-note {
      font-size: 24px;
      color: #888;
      margin: 6px 0;
      text-align: center;
    }
    .nback-instr-tip {
      font-size: 26px;
      color: #555;
      margin: 8px 0 4px;
      text-align: center;
      font-weight: bold;
    }
    .nback-instr-start-btn {
      margin-top: 6px !important;
      font-size: 30px !important;
    }

    /* Collapse jsPsych button group when buttons are hidden */
    .jspsych-btn-group-flex:has(button[style*="display:none"]),
    .jspsych-btn-group-grid:has(button[style*="display:none"]) {
      height: 0; overflow: hidden; margin: 0; padding: 0;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
  <script src="../../lib/jspsych.js?v=20260410e"></script>
  <script src="../../lib/plugins/html-button-response.js?v=20260410e"></script>
  <script src="../../lib/plugins/image-button-response.js?v=20260410e"></script>
  <script src="../../lib/plugins/call-function.js?v=20260410e"></script>
  <script src="../../lib/plugins/preload.js?v=20260410e"></script>
  <script src="../../lib/paradigm-camera.js?v=20260419f"></script>
  <script src="../../lib/jszip.min.js?v=20260410b"></script>
  <script src="../../lib/end-screen.js?v=20260419g"></script>
  <script src="../../lib/safe-fetch.js?v=20260418a"></script>
  <script src="../../lib/attention-probe.js?v=20260410e"></script>
  <script src="../../lib/progress.js?v=20260419a"></script>
  <script src="../../lib/touch-hardening.js?v=20260419c"></script>
  <script src="../../lib/voice-guide.js?v=20260423j"></script>
  <script src="nback.js?v=20260423a"></script>
</body>
</html>
