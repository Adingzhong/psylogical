<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红框区域编辑器 v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'PingFang SC', sans-serif; background: #1a1a2e; color: #fff; }

  /* ---- Top toolbar ---- */
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    background: rgba(26,26,46,0.97); padding: 8px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid #333;
  }
  .toolbar select, .toolbar button {
    font-size: 14px; padding: 5px 12px; border-radius: 6px; border: 1px solid #555;
    background: #2a2a4a; color: #fff; cursor: pointer;
  }
  .toolbar button:hover { background: #3a3a6a; }
  .toolbar button.danger { border-color: #E53935; color: #E53935; }
  .toolbar button.danger:hover { background: #E53935; color: #fff; }
  .audio-controls { display: flex; align-items: center; gap: 6px; }
  .audio-controls .time { font-size: 12px; color: #aaa; font-family: monospace; }

  /* ---- Left: step list panel ---- */
  .side-panel {
    position: fixed; top: 44px; left: 0; bottom: 160px; width: 340px; z-index: 100;
    background: rgba(26,26,46,0.95); overflow-y: auto;
    border-right: 1px solid #333; padding: 8px;
  }
  .step-card {
    padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
    background: #2a2a4a; border: 2px solid transparent; cursor: pointer;
    transition: border-color 0.2s;
  }
  .step-card.selected { border-color: #E53935; background: #3a2a3a; }
  .step-card .step-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .step-card .step-num { font-size: 13px; font-weight: bold; color: #E53935; }
  .step-card.selected .step-num { color: #ff6659; }
  .step-card .step-coords { font-size: 11px; color: #888; font-family: monospace; }
  .step-card .step-time { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
  .step-card .step-time label { font-size: 11px; color: #aaa; }
  .step-card .step-time input {
    width: 50px; font-size: 12px; padding: 2px 4px; border-radius: 4px;
    border: 1px solid #555; background: #1a1a2e; color: #fff; text-align: center;
  }
  .step-card textarea {
    width: 100%; font-size: 13px; padding: 4px 6px; border-radius: 4px;
    border: 1px solid #444; background: #1a1a2e; color: #ddd; resize: vertical;
    min-height: 36px; font-family: 'PingFang SC', sans-serif;
  }

  /* ---- Center: image area ---- */
  .canvas-area {
    margin-left: 340px; margin-top: 44px; margin-bottom: 160px;
    display: flex; justify-content: center; align-items: center;
    height: calc(100vh - 204px); background: #F0F2F5;
  }
  .img-container { position: relative; display: inline-block; }
  .img-container img {
    max-width: calc(100vw - 380px); max-height: calc(100vh - 220px);
    object-fit: contain; border-radius: 8px;
    user-select: none; -webkit-user-drag: none;
  }

  /* Region boxes */
  .region-box {
    position: absolute; border: 3px solid #E53935; border-radius: 6px;
    cursor: move; background: rgba(229,57,53,0.06);
    box-shadow: 0 0 0 3px rgba(229,57,53,0.15);
  }
  .region-box.inactive { border-color: rgba(100,100,100,0.5); background: rgba(100,100,100,0.04); box-shadow: none; border-width: 2px; }
  .region-box .label {
    position: absolute; top: -20px; left: 2px;
    font-size: 11px; color: #fff; font-weight: bold;
    background: #E53935; padding: 1px 6px; border-radius: 3px;
  }
  .region-box.inactive .label { background: #555; }
  .region-box .handle {
    position: absolute; width: 12px; height: 12px;
    background: #E53935; border: 2px solid #fff; border-radius: 2px;
  }
  .region-box.inactive .handle { display: none; }
  .handle.tl { top: -6px; left: -6px; cursor: nw-resize; }
  .handle.tr { top: -6px; right: -6px; cursor: ne-resize; }
  .handle.bl { bottom: -6px; left: -6px; cursor: sw-resize; }
  .handle.br { bottom: -6px; right: -6px; cursor: se-resize; }

  /* "继续" button overlay */
  .btn-overlay {
    position: absolute; border: 3px dashed #4FC3F7; border-radius: 8px;
    cursor: move; background: rgba(79,195,247,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #4FC3F7; font-weight: bold;
  }
  .btn-overlay .handle {
    position: absolute; width: 10px; height: 10px;
    background: #4FC3F7; border: 2px solid #fff; border-radius: 2px;
  }
  .btn-overlay .handle.br { bottom: -5px; right: -5px; cursor: se-resize; }

  /* ---- Bottom: output ---- */
  .output-panel {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: rgba(26,26,46,0.97); padding: 10px 16px;
    border-top: 1px solid #333;
  }
  .output-panel pre {
    font-size: 12px; color: #4FC3F7; font-family: 'SF Mono', monospace;
    white-space: pre-wrap; max-height: 130px; overflow-y: auto;
  }
  .output-panel .actions { position: absolute; top: 8px; right: 16px; display: flex; gap: 8px; }
  .output-panel button {
    font-size: 13px; padding: 4px 14px; border-radius: 6px;
    background: #4FC3F7; color: #000; border: none; cursor: pointer;
  }
</style>
</head>
<body>

<div class="toolbar">
  <select id="imageSelect">
    <option value="img/block1.webp">B1 — 记住目标图</option>
    <option value="img/block2.webp">B2 — 和上一张比</option>
    <option value="img/block3.webp">B3 — 选上一张</option>
    <option value="img/block4.webp">B4 — 跳一张比 (2-back)</option>
  </select>
  <div class="audio-controls">
    <button onclick="playAudio()">▶ 播放</button>
    <button onclick="stopAudio()">⏹</button>
    <span class="time" id="audioTime">0.0s</span>
  </div>
  <button onclick="addStep()">+ 添加步骤</button>
  <button class="danger" onclick="deleteStep()">× 删除选中</button>
</div>

<div class="side-panel" id="sidePanel"></div>

<div class="canvas-area">
  <div class="img-container" id="container">
    <img id="mainImg" src="img/block1.webp" draggable="false">
  </div>
</div>

<div class="output-panel">
  <div class="actions">
    <button onclick="copyOutput()">📋 复制代码</button>
    <button onclick="copyVoiceText()">📝 复制语音文本</button>
  </div>
  <pre id="output"></pre>
</div>

<script>
const audioMap = {

  'img/block4.webp': null,

const defaultSteps = {

  'img/block1.webp': [

    { x: 27.7, y: 14.3, w: 66.1, h: 31.1, subtitle: '后面会一张一张出现新的图片' },
    { x: 51.7, y: 21.3, w: 19.0, h: 23.7, subtitle: '每出现一张，都请和刚才的目标图比一比' },
    { x: 29.8, y: 52.9, w: 19.2, h: 37.2, subtitle: '如果和目标图一模一样，就点"一样"' },
    { x: 52.8, y: 52.5, w: 18.3, h: 37.2, subtitle: '如果还是同一张图，只是有一点小变化，就点"很像"' },

    { x: 27.4, y: 48.2, w: 67.9, h: 43.4, subtitle: '按你的第一感觉来选，不用着急' },
    { x: 79.6, y:  4.1, w: 16.0, h:  9.8, subtitle: '明白了就点击开始练习' },
  ],

    { x:  5.1, y: 14.3, w: 22.8, h: 80.1, subtitle: '这次没有固定的目标图，图片会一张一张出现' },
    { x:  7.8, y: 27.8, w: 17.0, h: 32.0, subtitle: '第一张图出来的时候，先记住它' },
    { x: 30.3, y: 16.0, w: 61.2, h: 40.5, subtitle: '从第二张开始，每出来一张，都和前面那一张比一比' },
    { x: 33.2, y: 29.1, w: 36.7, h: 26.6, subtitle: '比如第二张和第一张比' },
    { x: 53.1, y: 29.0, w: 37.0, h: 26.7, subtitle: '第三张和第二张比' },
    { x: 36.5, y: 66.9, w: 51.1, h:  6.0, subtitle: '如果和前一张一模一样，就点"一样"' },
    { x: 36.7, y: 73.8, w: 50.8, h:  6.3, subtitle: '如果还是很像，只是有一点变化，就点"很像"' },
    { x: 36.8, y: 80.6, w: 51.0, h:  6.4, subtitle: '如果已经不一样了，就点"不一样"' },
    { x: 32.0, y: 27.6, w: 58.8, h: 34.1, subtitle: '每次只和紧挨着前面的那一张比，不用去想更早的图片' },
    { x: 34.5, y: 59.2, w: 56.5, h: 31.9, subtitle: '按你的第一感觉来选，不用着急' },
    { x: 79.6, y:  4.1, w: 16.0, h:  9.8, subtitle: '明白了就点击开始练习' },
  ],
  'img/block3.webp': [
    { x:  5.2, y: 14.5, w: 15.9, h: 52.5, subtitle: '先看这张带橙色边框、写着"提示"的图，这就是提示图' },
    { x: 25.8, y: 30.3, w: 39.4, h: 23.6, subtitle: '后面图片会一张一张出现，前面先只看，不用按按钮' },
    { x: 65.3, y: 29.7, w: 16.2, h: 24.4, subtitle: '当提示图一出现，请马上想一想，它前面那一张是什么' },
    { x: 46.8, y: 55.9, w: 49.1, h: 27.8, subtitle: '这时屏幕会出现三张小图，请从里面选出提示图前一张' },
    { x: 51.7, y: 33.8, w: 13.8, h: 18.3, subtitle: '注意，不是选提示图本身，也不是选更早的图，只选它前面那一张' },
    { x: 50.2, y: 64.5, w: 42.2, h: 24.7, subtitle: '想一想再选，选你觉得最像的那一张' },
    { x: 79.6, y:  4.1, w: 16.0, h:  9.8, subtitle: '明白了就点击开始练习' },
  ],
  // B4 — 2026-04-16 戴敬力新设计,8 步语音 (s04/s06 为双框示例)
  // 双框步骤拆成相邻两条 [双框a]/[双框b],之后回填 nback.js 时合并为 regions:[...]
  'img/block4.webp': [
    { x: 27.0, y: 11.5, w: 67.0, h: 11.0, subtitle: '这次的规则有点不一样' },
    { x:  5.0, y: 21.0, w: 22.0, h: 64.0, subtitle: '先看左边，记住前面这两张图' },
    { x: 27.0, y: 33.0, w: 67.0, h: 17.0, subtitle: '从第3张开始，每张图都和它前面隔一张的那张比' },
    { x: 54.0, y: 33.5, w: 12.0, h: 16.0, subtitle: '比如这第3张就和第1张比 [双框a]' },
    { x: 28.0, y: 33.5, w: 12.0, h: 16.0, subtitle: '比如这第3张就和第1张比 [双框b]' },
    { x: 42.0, y: 72.0, w: 12.0, h: 11.0, subtitle: '完全一样就点一致按钮' },
    { x: 67.0, y: 33.5, w: 12.0, h: 16.0, subtitle: '再看，第4张和第2张比 [双框a]' },
    { x: 41.0, y: 33.5, w: 12.0, h: 16.0, subtitle: '再看，第4张和第2张比 [双框b]' },
    { x: 48.0, y: 22.0, w: 30.0, h:  9.0, subtitle: '不一样什么都不用做，等下一张' },
    { x: 79.4, y:  3.8, w: 14.8, h:  6.2, subtitle: '明白了就点击开始练习' },
  ],
};

// "继续" button overlay position (percentage of image) — per image
// 数值与 nback.js 中各 block 的 btnRegion 一致 (2026-04-16 同步)
const defaultBtnOverlay = {
  'img/block1.webp': { x: 80.1, y: 4.9, w: 15.0, h: 8.2 },
  'img/block2.webp': { x: 80.1, y: 4.9, w: 15.0, h: 8.2 },
  'img/block3.webp': { x: 80.1, y: 4.9, w: 15.0, h: 8.2 },
  'img/block4.webp': { x: 79.4, y: 3.8, w: 14.8, h: 6.2 },
};
let btnOverlay = { x: 80.1, y: 4.9, w: 15.0, h: 8.2 };

let steps = [];
let currentStep = 0;
let currentImage = 'img/block1.png';
let audioEl = null;
let dragging = null;

const container = document.getElementById('container');
const mainImg = document.getElementById('mainImg');
const outputEl = document.getElementById('output');

function loadImage(src) {
  currentImage = src;
  mainImg.src = src;
  steps = JSON.parse(JSON.stringify(defaultSteps[src] || []));
  if (defaultBtnOverlay[src]) {
    btnOverlay = JSON.parse(JSON.stringify(defaultBtnOverlay[src]));
  }
  currentStep = 0;
  stopAudio();
  renderAll();
}

document.getElementById('imageSelect').addEventListener('change', (e) => loadImage(e.target.value));

function selectStep(idx) {
  currentStep = idx;
  renderAll();
}

function addStep() {
  const last = steps[steps.length - 1] || { end: 0 };
  steps.push({ x: 20, y: 20, w: 30, h: 20, subtitle: '', start: last.end, end: last.end + 2.5 });
  currentStep = steps.length - 1;
  renderAll();
}

function deleteStep() {
  if (steps.length <= 1) return;
  steps.splice(currentStep, 1);
  if (currentStep >= steps.length) currentStep = steps.length - 1;
  renderAll();
}

function renderAll() {
  renderSidePanel();
  renderBoxes();
  renderBtnOverlay();
  updateOutput();
}

// ---- Side panel ----
function renderSidePanel() {
  const panel = document.getElementById('sidePanel');
  panel.innerHTML = '';
  steps.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'step-card' + (i === currentStep ? ' selected' : '');
    card.innerHTML = `
      <div class="step-header">
        <span class="step-num">Step ${i + 1}</span>
        <span class="step-coords">${s.x}%, ${s.y}% | ${s.w}×${s.h}%</span>
      </div>
      <!-- 逐句播放，不需要时间戳 -->
      <textarea data-idx="${i}" placeholder="字幕文字（每行一句，同一个红框内播放多句）">${s.subtitle}</textarea>
      <div style="font-size:10px;color:#666;margin-top:2px;">每行 = 一句音频。多行共享同一个红框位置</div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      selectStep(i);
    });
    card.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('change', (e) => {
        steps[+e.target.dataset.idx][e.target.dataset.field] = parseFloat(e.target.value) || 0;
        updateOutput();
      });
    });
    card.querySelector('textarea').addEventListener('input', (e) => {
      steps[+e.target.dataset.idx].subtitle = e.target.value;
      updateOutput();
    });
    panel.appendChild(card);
  });

  // "继续" button position card
  const btnCard = document.createElement('div');
  btnCard.className = 'step-card';
  btnCard.style.borderColor = '#4FC3F7';
  btnCard.style.background = '#1a2a3a';
  btnCard.innerHTML = `
    <div class="step-header">
      <span class="step-num" style="color:#4FC3F7;">📌 "继续"按钮位置</span>
      <span class="step-coords">${btnOverlay.x}%, ${btnOverlay.y}% | ${btnOverlay.w}×${btnOverlay.h}%</span>
    </div>
    <div style="font-size:11px;color:#888;margin-top:4px;">蓝色虚线框 — 拖拽调整覆盖按钮位置</div>
  `;
  panel.appendChild(btnCard);
}

// ---- Region boxes ----
function renderBoxes() {
  container.querySelectorAll('.region-box').forEach(el => el.remove());
  steps.forEach((s, i) => {
    const box = document.createElement('div');
    box.className = 'region-box' + (i === currentStep ? '' : ' inactive');
    box.style.left = s.x + '%'; box.style.top = s.y + '%';
    box.style.width = s.w + '%'; box.style.height = s.h + '%';

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = i + 1;
    box.appendChild(label);

    ['tl', 'tr', 'bl', 'br'].forEach(h => {
      const handle = document.createElement('div');
      handle.className = 'handle ' + h;
      handle.dataset.handle = h;
      box.appendChild(handle);
    });

    box.addEventListener('pointerdown', (e) => startDrag(e, i, 'step'));
    container.appendChild(box);
  });
}

// ---- "继续" button overlay ----
function renderBtnOverlay() {
  container.querySelectorAll('.btn-overlay').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'btn-overlay';
  el.style.left = btnOverlay.x + '%'; el.style.top = btnOverlay.y + '%';
  el.style.width = btnOverlay.w + '%'; el.style.height = btnOverlay.h + '%';
  el.textContent = '继续';
  const handle = document.createElement('div');
  handle.className = 'handle br';
  handle.dataset.handle = 'br';
  el.appendChild(handle);
  el.addEventListener('pointerdown', (e) => startDrag(e, -1, 'btn'));
  container.appendChild(el);
}

// ---- Drag logic ----
function startDrag(e, idx, kind) {
  e.preventDefault();
  e.stopPropagation();
  if (kind === 'step' && idx !== currentStep) { selectStep(idx); return; }

  const obj = kind === 'btn' ? btnOverlay : steps[idx];
  const imgRect = mainImg.getBoundingClientRect();
  const handle = e.target.dataset.handle;

  dragging = {
    kind, idx, handle,
    type: handle ? 'resize' : 'move',
    startX: e.clientX, startY: e.clientY,
    origX: obj.x, origY: obj.y, origW: obj.w, origH: obj.h,
    imgW: imgRect.width, imgH: imgRect.height,
  };
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
}

function onDragMove(e) {
  if (!dragging) return;
  const d = dragging;
  const dx = (e.clientX - d.startX) / d.imgW * 100;
  const dy = (e.clientY - d.startY) / d.imgH * 100;
  const obj = d.kind === 'btn' ? btnOverlay : steps[d.idx];

  if (d.type === 'move') {
    obj.x = Math.round(Math.max(0, Math.min(100 - obj.w, d.origX + dx)) * 10) / 10;
    obj.y = Math.round(Math.max(0, Math.min(100 - obj.h, d.origY + dy)) * 10) / 10;
  } else {
    const h = d.handle;
    if (h.includes('l')) { obj.x = Math.round((d.origX + dx) * 10) / 10; obj.w = Math.max(3, Math.round((d.origW - dx) * 10) / 10); }
    if (h.includes('r')) { obj.w = Math.max(3, Math.round((d.origW + dx) * 10) / 10); }
    if (h.includes('t')) { obj.y = Math.round((d.origY + dy) * 10) / 10; obj.h = Math.max(3, Math.round((d.origH - dy) * 10) / 10); }
    if (h.includes('b')) { obj.h = Math.max(3, Math.round((d.origH + dy) * 10) / 10); }
  }

  if (d.kind === 'btn') { renderBtnOverlay(); }
  else { renderBoxes(); }
  renderSidePanel();
  updateOutput();
}

function onDragEnd() {
  dragging = null;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
}

// ---- Output ----
function updateOutput() {
  const blockName = currentImage.includes('block1') ? 'B1' : currentImage.includes('block2') ? 'B2' : currentImage.includes('block3') ? 'B3' : 'B4';
  const parts = steps.map(s => {
    const subs = s.subtitle.split('\n').filter(l => l.trim());
    const region = `{ x: '${s.x}%', y: '${s.y}%', w: '${s.w}%', h: '${s.h}%' }`;
    if (subs.length <= 1) {
      return `  { region: ${region}, lines: ['${subs[0] || ''}'] },`;
    } else {
      const linesStr = subs.map(l => `'${l.trim()}'`).join(', ');
      return `  { region: ${region}, lines: [${linesStr}] },`;
    }
  });
  const btnLine = `\nbtnOverlay: { x: '${btnOverlay.x}%', y: '${btnOverlay.y}%', w: '${btnOverlay.w}%', h: '${btnOverlay.h}%' }`;
  outputEl.textContent = `${blockName}: [\n${parts.join('\n')}\n]${btnLine}`;
}

function copyOutput() {
  navigator.clipboard.writeText(outputEl.textContent);
  event.target.textContent = '✓ 已复制';
  setTimeout(() => event.target.textContent = '📋 复制代码', 1500);
}

function copyVoiceText() {
  // Flatten all lines
  let n = 1;
  const text = steps.flatMap(s => s.subtitle.split('\n').filter(l => l.trim())).map(l => `${n++}. ${l.trim()}`).join('\n');
  navigator.clipboard.writeText(text);
  event.target.textContent = '✓ 已复制';
  setTimeout(() => event.target.textContent = '📝 复制语音文本', 1500);
}

// ---- Audio ----
function playAudio() {
  stopAudio();
  const src = audioMap[currentImage];
  if (!src) return;
  audioEl = new Audio(src);
  audioEl.play();
  const tick = () => {
    if (!audioEl) return;
    document.getElementById('audioTime').textContent = audioEl.currentTime.toFixed(1) + 's';
    const t = audioEl.currentTime;
    for (let i = 0; i < steps.length; i++) {
      if (t >= steps[i].start && t < steps[i].end && i !== currentStep) {
        selectStep(i);
        break;
      }
    }
    if (!audioEl.paused) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function stopAudio() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  document.getElementById('audioTime').textContent = '0.0s';
}

loadImage('img/block1.webp');
</script>
